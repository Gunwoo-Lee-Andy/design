- table [ref=e2]:
  - rowgroup [ref=e3]:
    - row "INVESTMENT PROPOSAL MyMiniMe Studio 안녕하세요, 스마일게이트인베스트먼트 담당자님. IP·게임·콘텐츠 이해도 최상를 통해 귀사를 알게 되어 연락 드립니다. 그리스는 동상으로, 르네상스는 그림으로, 현대는 사진으로 사람을 기록했습니다. 지금은 3D 데이터의 시대입니다. MyMiniMe Studio는 42대 카메라로 0.1초 만에 사람을 3D 스캔하여 실물 피규어·AR 아바타·AI 학습데이터로 재사용하는 3D 디지털 자산 스튜디오입니다. 체코 Photorobot + 독일 botspot 공식 한국 파트너로서, 이미 전국 6개 이상의 오프라인 거점을 운영하며 월 400명 이상의 고객에게 서비스를 제공하고 있습니다. 400+ 월 고객수 6+ 오프라인 거점 4.5억 Seed 목표 피치덱 보기 → 15분 간략 미팅을 요청 드립니다. 편하신 일정을 알려주시면 맞추겠습니다. MyMiniMe Studio ir@myminime.co.kr MYMMINIME STUDIO · myminime.co.kr" [ref=e4]:
