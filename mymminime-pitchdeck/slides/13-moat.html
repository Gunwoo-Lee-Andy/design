<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>13 · Moat</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .slide { justify-content: center; align-items: center; text-align: center; }

  h2 {
    font-size: 52px; margin-bottom: 28px; line-height: 1.3;
    max-width: 1000px;
  }
  .lead { margin-bottom: 72px; max-width: 900px; text-align: center; }

  .flywheel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin-bottom: 64px;
    width: 100%;
    max-width: 1400px;
  }

  .fw-node {
    flex: 1;

    text-align: center;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
  }

  .fw-node h3 { font-size: 20px; margin-bottom: 10px; line-height: 1.4; }
  .fw-node p  { font-size: 17px; color: var(--ink-light); line-height: 1.6; }

  .fw-arrow {
    font-size: 22px; color: var(--coral);
    margin: 0 14px; flex-shrink: 0;
    font-family: var(--display);
  }

  .moat-callout {
    background: var(--ink);
    color: #fff;
    border-radius: 16px;
    padding: 40px 56px;
    max-width: 900px;
    text-align: center;
  }

  .moat-callout p {
    font-size: 24px;
    font-weight: 500;
    line-height: 1.7;
  }

  .moat-callout strong {
    color: var(--coral);
    font-weight: 700;
  }
</style>
</head><body>
  <div class="slide">

    </p>

    <div class="flywheel rise-4">
      <div class="fw-node">

      <div class="fw-node">

        <p>진입 가격 인하 가능</p>

    </div>

    </div>

    <div class="slide-footer" style="width: calc(100% - 280px);">
      <span><span class="page-dot"></span>MYMINIME STUDIO</span>
      <span>13</span>
    </div>
