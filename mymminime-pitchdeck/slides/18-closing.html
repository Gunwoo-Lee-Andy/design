<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>18 · Closing</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body { background: var(--ink); }

  .slide {
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .closing-mark {
    width: 64px; height: 6px;
    background: var(--coral);
    border-radius: 3px;
    margin: 0 auto 56px;
  }

  h1 {
    color: #fff;
    font-size: 64px;
    line-height: 1.25;
    margin-bottom: 36px;
    max-width: 1100px;
  }

  .sub {
    font-size: 24px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    line-height: 1.75;
    max-width: 800px;
  }

  .highlight-line {
    margin-top: 56px;
    display: inline-flex;
    gap: 48px;
    align-items: center;
  }

  .highlight-line .h-item {
    text-align: center;
  }

  .highlight-line .h-value {
    font-family: var(--display);
    font-size: 48px;
    font-weight: 800;
    color: var(--coral);
  }

  .highlight-line .h-label {
    font-size: 16px;
    color: rgba(255,255,255,0.35);
    margin-top: 8px;
    font-weight: 500;
  }

  .h-divider {
    width: 1px; height: 48px;
    background: rgba(255,255,255,0.15);
  }

  .cta {
    margin-top: 64px;
    display: inline-flex;
    padding: 20px 56px;
    background: var(--coral);
    color: #fff;
    border-radius: 12px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .slide-footer { color: rgba(255,255,255,0.2); }
  .page-dot { background: var(--coral); }
</style>
</head><body>
  <div class="slide">
    <div class="closing-mark rise"></div>

    <h1 class="rise-2">피규어 회사가 아니라,<br>사람의 3D 자산을 보관하고<br>재사용하게 만드는 회사</h1>

    <p class="sub rise-3">
      기억을 사는 고객 접점에서 출발해,<br>
      실물 굿즈와 디지털 트윈을 동시에 확장합니다.
    </p>

    <div class="highlight-line rise-4">
      <div class="h-item">
        <div class="h-value">₩4.5B</div>
        <div class="h-label">Seed / Pre-A</div>
      </div>
      <div class="h-divider"></div>
      <div class="h-item">
        <div class="h-value">6+</div>
        <div class="h-label">오프라인 거점</div>
      </div>
      <div class="h-divider"></div>
      <div class="h-item">
        <div class="h-value">4L</div>
        <div class="h-label">Platform Layers</div>
      </div>
    </div>

    <div class="cta rise-5">CONNECT WITH US</div>

    <div class="slide-footer rise-5">
      <span><span class="page-dot"></span>MYMINIME STUDIO</span>
      <span>18</span>
    </div>
  </div>
</body></html>
