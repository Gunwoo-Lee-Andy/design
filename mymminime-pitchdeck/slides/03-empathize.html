<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>03 · Empathize</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body { background: var(--warm); }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100%;
  }

  .photo-side {
    position: relative;
    overflow: hidden;
  }

  .photo-side img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .text-side {
    padding: 100px 80px 80px 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  h2 { font-size: 52px; margin-bottom: 28px; line-height: 1.3; }

  .lead {
    font-size: 22px;
    margin-bottom: 48px;
    max-width: 640px;
    line-height: 1.7;
  }

  .insight-list {
    list-style: none;
    margin-bottom: 48px;
  }

  .insight-list li {
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 20px;
    align-items: baseline;
  }

  .insight-list li:first-child { border-top: 1px solid var(--border); }

  .insight-num {
    font-family: var(--display);
    font-size: 14px; font-weight: 800;
    color: var(--coral);
    min-width: 28px;
    flex-shrink: 0;
  }

  .insight-text {
    font-size: 21px;
    font-weight: 500;
    color: var(--ink-light);
    line-height: 1.6;
  }

  .insight-text strong { color: var(--ink); font-weight: 700; }

  .callout {
    background: var(--ink);
    color: #fff;
    padding: 28px 36px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: 500;
    line-height: 1.7;
  }

  .callout strong { color: var(--coral); font-weight: 700; }
</style>
</head><body>
  <div class="layout">
    <div class="photo-side rise">
      <img src="../assets/family.png" alt="한 가족이 피규어를 보며 웃는 장면">
    </div>

    <div class="text-side">
      <div class="section-label rise">02 · EMPATHIZE</div>

      <h2 class="rise-2">고객의 진짜 욕구는<br>"닮음"보다 <span class="coral">"남김"</span></h2>

      <p class="lead rise-3">
        고객이 왜 이 순간을 물건으로 붙잡고 싶은지,<br>
        제품 설명보다 먼저 봐야 할 것입니다.
      </p>

      <ul class="insight-list rise-4">
        <li>
          <span class="insight-num">01</span>
          <span class="insight-text"><strong>가족 · 웨딩</strong> — 시간이 지나 변해버릴 지금 이 모습을 입체로 남기고 싶다</span>
        </li>
        <li>
          <span class="insight-num">02</span>
          <span class="insight-text"><strong>반려동물</strong> — 세상에 하나뿐인 내 아이를 만질 수 있는 실체로 가지고 싶다</span>
        </li>
        <li>
          <span class="insight-num">03</span>
          <span class="insight-text"><strong>추모</strong> — 사진보다 깊고 입체적인 기억의 의식(Ritual)이 필요하다</span>
        </li>
      </ul>

      <div class="callout rise-5">
        감정소비는 <strong>가격 저항을 무력화</strong>합니다.<br>
        개인화된 기억은 강력한 재구매·추천 루프를 만듭니다.
      </div>
    </div>
  </div>
</body></html>
